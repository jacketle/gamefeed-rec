<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameFeed｜实验结果与技术图解</title>
<style>
:root{--ink:#20313b;--muted:#596a75;--line:#dce4e9;--accent:#176657;--light:#eef5f2;--paper:#fff;--bg:#f5f7f9}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;font:16px/1.85 'Segoe UI','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}a{color:var(--accent);text-underline-offset:3px}a:hover{color:#0b4539}button,input{font:inherit}button,.button{cursor:pointer;min-height:42px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;padding:8px 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;line-height:1.5}button:hover,.button:hover{background:var(--light);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.button{background:var(--accent);color:#fff}.button:hover{color:var(--accent)}.button.secondary{background:#fff;color:var(--accent)}:focus-visible{outline:3px solid #ad7028;outline-offset:3px}.skip{position:absolute;top:-70px;padding:12px;background:#fff;z-index:10}.skip:focus{top:0}
.shell{max-width:1480px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr)}.rail{position:sticky;top:0;height:100vh;padding:34px 22px;border-right:1px solid var(--line);background:#fff;overflow:auto}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.rail .meta{font-size:12px;margin:2px 0 25px}.rail nav{display:flex;flex-direction:column;gap:3px}.rail nav a{display:block;text-decoration:none;color:var(--muted);padding:8px 10px;font-size:13px;border-radius:4px}.rail nav a:hover{background:var(--light);color:var(--accent)}.rail-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:14px}
main{min-width:0;padding:0 46px 30px;max-width:1190px}section{padding:45px 0;border-bottom:1px solid var(--line);scroll-margin-top:10px}.hero{padding-top:54px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:clamp(30px,3vw,45px);line-height:1.35;letter-spacing:-1px;margin:18px 0}h2{font-size:25px;line-height:1.5;margin:0}h3{font-size:18px;line-height:1.6;margin:20px 0 8px}.lead{font-size:19px;color:var(--muted);max-width:780px}.meta,.reader{font-size:13px;color:var(--muted)}.section-head{display:flex;gap:16px;align-items:center;margin-bottom:23px}.section-head>span{font-size:13px;font-weight:700;color:var(--accent);border:1px solid #a7bdb5;padding:2px 8px;border-radius:3px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:30px 0;background:var(--paper)}.kpis>div{padding:22px;border-right:1px solid var(--line)}.kpis>div:last-child{border:0}.kpis small,.kpis span{display:block;font-size:12px;color:var(--muted)}.kpis strong{display:block;font-size:36px;line-height:1.7;letter-spacing:-1px;font-variant-numeric:tabular-nums}.kpis em{font-size:12px;font-style:normal;letter-spacing:0;margin-left:6px}.finding,.takeaway,.talk{background:var(--light);border-left:3px solid var(--accent);padding:17px 22px;margin:24px 0}.finding p{margin:5px 0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:30px}.two-col p{margin-top:6px}
figure{margin:22px 0;background:#fff;border:1px solid var(--line);padding:22px 20px 16px;break-inside:avoid}.chart{display:block;width:100%;height:auto}figcaption{font-size:13px;color:var(--muted);line-height:1.75;padding:14px 10px 0;border-top:1px solid #eef1f3;margin-top:12px}figcaption b{color:var(--ink)}.table-wrap{overflow:auto;margin:20px 0;border:1px solid var(--line);background:white}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}th{background:#edf1f4;text-align:left;color:#3c515d;white-space:nowrap}td,th{padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:top}td{min-width:70px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7faf9}
details{margin:16px 0;border:1px solid var(--line);background:white;padding:15px 20px}summary{cursor:pointer;font-weight:600;line-height:1.7;min-height:30px}details ul{padding-left:22px;color:var(--muted);font-size:14px}.formula-grid{display:grid;grid-template-columns:1fr;gap:18px}.formula-card{background:#fff;border:1px solid var(--line);padding:22px 26px;break-inside:avoid;min-width:0}.formula-card h3{margin-top:0}.formula-card p{font-size:14px;margin-bottom:0}.formula{width:100%;height:auto;display:block}.formula-card:nth-child(even){border-left:3px solid #718da8}
.flow-controls,.qa-controls,.downloads{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}#stage-count{font-size:13px;color:var(--muted)}#flow-image{background:white;border:1px solid var(--line);padding:10px}.stage-copy{background:#fff;border:1px solid var(--line);border-top:0;padding:22px;min-height:150px}.stage-copy h3{margin-top:0}.slider-label{display:block;font-weight:600}input[type=range]{width:100%;accent-color:var(--accent);height:32px}.check{display:flex;align-items:center;gap:10px;min-height:44px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}.toy-row{animation:enter .25s ease-out}.toy-dropped{color:#8a96a0;background:#f6f7f8}.toy-dropped td:first-child{text-decoration:line-through}.qa-controls label{font-size:13px}input[type=search]{min-width:230px;flex:1;min-height:44px;background:white;border:1px solid #a5b6c0;border-radius:4px;padding:9px 13px}#qa-count{font-size:12px;color:var(--muted)}.qa>summary>span{font-size:12px;color:var(--accent);margin-right:8px}.qa summary small{display:inline-block;font-size:11px;font-weight:400;color:var(--muted);border:1px solid var(--line);padding:0 5px;margin-left:8px}.answer{padding:6px 2px 0;font-size:15px}.example{border-left:2px solid #c79d6d;padding-left:14px}.code{font-family:'Consolas','Microsoft YaHei',monospace;font-size:12px;color:#5a6b76;overflow-wrap:anywhere}.references{font-size:14px;padding-left:20px}.talk ol{padding-left:22px}.talk li{margin-bottom:8px}.footer{font-size:12px;color:var(--muted);padding:24px 0}.qa[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes enter{from{opacity:.4}to{opacity:1}}
@media(max-width:1100px){.shell{grid-template-columns:190px minmax(0,1fr)}main{padding:0 26px}.rail{padding:25px 14px}.kpis>div{padding:16px}.kpis strong{font-size:29px}}
@media(max-width:800px){.shell{display:block}.rail{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 20px}.rail .meta{margin-bottom:12px}.rail nav{display:flex;flex-direction:row;overflow:auto;gap:6px}.rail nav a{flex:0 0 auto;padding:6px 10px;border:1px solid var(--line)}.rail-note{display:none}main{padding:0 18px}section{padding:30px 0}.hero{padding-top:25px}h1{font-size:31px}.lead{font-size:16px}h2{font-size:21px}.kpis{grid-template-columns:1fr}.kpis>div{border-right:0;border-bottom:1px solid var(--line);padding:15px 20px}.kpis strong{font-size:32px}.two-col{grid-template-columns:1fr;gap:0}figure{padding:8px}.formula-card{padding:16px}.table-wrap{margin:14px 0}.qa{padding:14px}.qa-controls{gap:8px}input[type=search]{min-width:0;width:100%;flex-basis:100%}.section-head{gap:10px}.stage-copy{min-height:190px}.downloads>*{width:100%}.formula{min-width:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toy-row{animation:none}}
@media print{@page{size:A4;margin:15mm}body{background:white;font-size:10pt}.shell{display:block}.rail,.skip,.flow-controls,.qa-controls,.downloads,#alpha,.check,.slider-label{display:none}main{padding:0;max-width:none}.hero{padding-top:0}section{padding:22px 0;break-inside:auto}h1{font-size:25pt}h2{font-size:17pt}h3{font-size:12pt}figure,.formula-card,.qa{break-inside:avoid}figure{padding:8px}.chart{max-height:220mm;object-fit:contain}.kpis strong{font-size:23pt}.kpis{grid-template-columns:repeat(3,1fr)}.kpis>div{border-bottom:0;border-right:1px solid var(--line)}.table-wrap{overflow:visible}table{font-size:9pt}td,th{padding:6px}.qa[hidden]{display:block}.code{font-size:8pt}a{color:inherit;text-decoration:none}.meta{font-size:8pt}}
.formula{width:auto;max-width:100%;max-height:115px;object-fit:contain;object-position:left center}.chart,.formula{cursor:zoom-in}dialog{border:1px solid var(--line);border-radius:8px;width:min(1300px,96vw);padding:16px;background:white}dialog::backdrop{background:rgba(20,35,45,.55)}.zoom-head{display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:13px;color:var(--muted);margin-bottom:12px}.zoom-body{overflow:auto;max-height:80vh}.zoom-body img{display:block;max-width:none;width:100%;min-width:760px;height:auto}.zoom-body img.formula-zoom{width:auto;min-width:0;max-width:none;height:160px}.zoom-note{font-size:12px;color:var(--muted)}@media print{dialog{display:none!important}.formula{max-height:25mm}.chart,.formula{cursor:default}}
</style></head>
<body><a class="skip" href="#overview">跳到报告正文</a><div class="shell"><aside class="rail"><div class="brand">GameFeed</div><p class="meta">实验结果与技术图解</p><nav aria-label="报告目录">
<span class="nav-group">理解项目</span><a href="#overview">项目总览</a><a href="#methods">数据与评价方法</a><a href="#architecture">四张模型结构图</a><a href="#flow">推荐流程 · 交互演示</a><span class="nav-group">阅读结果</span><a href="#retrieval">召回对照</a><a href="#fusion">融合方案的选择</a><a href="#final-evaluation">提升来源与前10条</a><a href="#ranking">行为预测与学习曲线</a><a href="#diagnostics">双塔检查</a><a href="#groups">游戏内容与用户分组</a><span class="nav-group">技术说明</span><a href="#formulas">公式与参数</a><a href="#glossary">术语速查</a><a href="#sources">参考资料与导出</a></nav><p class="rail-note">离线阅读 · 点击图片放大</p></aside>
<main>__BODY__<footer class="footer">GameFeed · 实验结果与技术图解</footer></main></div>
<dialog id="image-dialog"><div class="zoom-head"><span>查看大图</span><button id="close-image" type="button">关闭</button></div><div class="zoom-body"><img id="zoom-image" alt="放大的图表"></div></dialog>
<script>
const flowImages=__FLOW_IMAGES__;
const stages=[
 ['读取历史记录','用户U在4月25日前看过A、B、C，且这三条记录的观看都已达标。预测4月25日的兴趣时，使用前一天结束前的这些记录。','最多保留20条记录；不足的部分补齐，用掩码标出补齐位置，计算均值时跳过。'],
 ['召回：选择候选内容','热门召回此前观看达标次数多的内容；ItemCF寻找与A、B、C相似的内容；BGE按文案语义检索。双塔单独参与实验比较。','每种方法最多取100条，均从当天可用内容中选择。'],
 ['融合：合并候选并排序','选定方案保留热门前10条，再用ItemCF补齐100条，重复ID只留一条。集合内按三路RRF分数排序。','BGE不单独占名额，已经入选的内容可以累加BGE提供的排名分数。'],
 ['模型排序：预测观看达标与点赞','拼接用户、内容、历史、标签、时长和场景特征。两个独立模型分别预测观看达标和点赞，再用加权分数决定顺序。','拖动下面的滑块，可以观察两个目标的权重如何改变推荐顺序。'],
 ['重排：限制同作者的内容数量','从高分开始依次选择，每位作者最多出现2条。项目演示最多返回10条；下方示例表返回前4条。','作者达到2条后，继续向后选取其他作者的内容。']
];
let stage=0,timer=null;
function renderStage(){document.querySelector('#flow-image img').src=flowImages[stage];document.querySelector('#stage-count').textContent=`第 ${stage+1} / 5 步`;const d=stages[stage];document.querySelector('#stage-copy').innerHTML=`<h3>${d[0]}</h3><p>${d[1]}</p><p>${d[2]}</p>`;document.querySelector('#previous').disabled=stage===0;document.querySelector('#next').disabled=stage===4;}
function stopPlay(){if(timer)clearInterval(timer);timer=null;document.querySelector('#play').textContent='自动演示';}
document.querySelector('#previous').onclick=()=>{stopPlay();stage=Math.max(0,stage-1);renderStage();};
document.querySelector('#next').onclick=()=>{stopPlay();stage=Math.min(4,stage+1);renderStage();};
document.querySelector('#play').onclick=()=>{if(timer){stopPlay();return;}if(stage===4)stage=0;renderStage();document.querySelector('#play').textContent='暂停演示';timer=setInterval(()=>{stage=Math.min(4,stage+1);renderStage();if(stage===4)stopPlay();},2200);};
const toys=[{id:'A',author:'作者甲',long:.90,like:.10},{id:'B',author:'作者甲',long:.85,like:.20},{id:'C',author:'作者甲',long:.80,like:.30},{id:'D',author:'作者乙',long:.60,like:.80},{id:'E',author:'作者丙',long:.50,like:.70},{id:'F',author:'作者丁',long:.40,like:.90}];
function toy(){const alpha=Number(document.querySelector('#alpha').value),cap=document.querySelector('#cap').checked;document.querySelector('#alpha-value').textContent=alpha.toFixed(1);const rows=toys.map(r=>({...r,score:alpha*r.long+(1-alpha)*r.like})).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));const counts={},selected=[];for(const r of rows){r.keep=selected.length<4&&(!cap||(counts[r.author]||0)<2);if(r.keep){selected.push(r.id);counts[r.author]=(counts[r.author]||0)+1;}}document.querySelector('#toy-table').innerHTML='<div class="table-wrap"><table><thead><tr><th>内容</th><th>作者</th><th>观看达标概率</th><th>点赞概率</th><th>综合分</th><th>前4条</th></tr></thead><tbody>'+rows.map(r=>`<tr class="toy-row ${r.keep?'':'toy-dropped'}"><td>${r.id}</td><td>${r.author}</td><td>${r.long.toFixed(2)}</td><td>${r.like.toFixed(2)}</td><td>${r.score.toFixed(3)}</td><td>${r.keep?'入选':'跳过'}</td></tr>`).join('')+'</tbody></table></div>';document.querySelector('#toy-explain').textContent=`当前公式：${alpha.toFixed(1)} × 观看达标 + ${(1-alpha).toFixed(1)} × 点赞。输出：${selected.join(' → ')}。${cap?'同作者达到2条后，继续向后选择其他作者。':'列表直接按综合分取前4条。'}`;}
document.querySelector('#alpha').oninput=toy;document.querySelector('#cap').onchange=toy;
document.querySelector('#print-report').onclick=()=>window.print();let priorPrint=[];
window.addEventListener('beforeprint',()=>{priorPrint=Array.from(document.querySelectorAll('details')).map(el=>[el,el.open]);priorPrint.forEach(([el])=>el.open=true);});
window.addEventListener('afterprint',()=>priorPrint.forEach(([el,open])=>el.open=open));
document.querySelectorAll('img.chart,img.formula').forEach(img=>{img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大：'+img.alt);img.title='点击放大查看';const zoom=()=>{const target=document.querySelector('#zoom-image');target.src=img.src;target.alt=img.alt;target.className=img.classList.contains('formula')?'formula-zoom':'';document.querySelector('#image-dialog').showModal();};img.onclick=zoom;img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom();}};});
document.querySelector('#close-image').onclick=()=>document.querySelector('#image-dialog').close();
renderStage();toy();
</script></body></html>
