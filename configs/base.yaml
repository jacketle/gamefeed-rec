seed: 2026

paths:
  raw_dir: data/raw/kuairand
  processed_dir: data/processed/kuairand
  artifact_dir: artifacts
  report_dir: reports/generated

data:
  train_start: "2022-04-08"
  train_end: "2022-04-21"
  dev_start: "2022-04-22"
  dev_end: "2022-04-28"
  test_start: "2022-04-29"
  test_end: "2022-05-08"
  history_length: 20
  max_negative_per_positive: 4
  sample_users: 5000
  chunksize: 200000

model:
